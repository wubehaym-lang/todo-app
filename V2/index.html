<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="todo-box">
    <div class="todo-header">
      <button class="menuBtn" id="menuBtn">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="menu-popup hidden">
        <div class="sort-by menus">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoine="round">
            <polyline points="9 6 15 12 9 18"></polyline>
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>Sort-by</div>
          
        <div class="sortBox hidden">
          <div class="sort-menu">Added Date</div>
          <div class="sort-menu">Time</div>
          <div class="sort-menu">A-Z</div>
        </div>
        <div class="menus">Todo Data</div>
        <div class="menus" id="clearAll">Clear All</div>
      </div>

      <div class="title">Todo List</div>
      <div class="error-box hidden">Error: The value must not be empty</div>
      <div class="input-box">
        <input type="text" class="input-action" id="inputAction">
        <input type="time" class="action-time" id="actionTime"> 
        <button class="add-btn" id="add-btn">Add</button>
      </div>
    </div>
    <div class="nav">
      <span class="span"></span>
      <button class="nav-btn">All</button>
      <button class="nav-btn">Active</button>
      <button class="nav-btn">Completed</button>
    </div>
    <div class="todo-list-container" id="renderList" >
      
    </div>
    
  </div>
  <script src ="script.js"></script>
</body>
</html>
